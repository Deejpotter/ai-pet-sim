<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Pet Sim</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
      color: #fff;
      height: 100vh;
      overflow: hidden;
    }

    #root {
      width: 100%;
      height: 100%;
    }

    .app {
      display: flex;
      flex-direction: column;
      height: 100vh;
    }

    .header {
      padding: 1rem;
      background: rgba(0, 0, 0, 0.3);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .header h1 {
      font-size: 1.5rem;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .connection-status {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      font-size: 0.875rem;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #ef4444;
    }

    .status-dot.connected {
      background: #22c55e;
    }

    .main-content {
      flex: 1;
      display: flex;
      overflow: hidden;
    }

    .game-area {
      flex: 1;
      position: relative;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    #creature-canvas {
      border-radius: 1rem;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
    }

    /* Death Overlay */
    .death-overlay {
      position: absolute;
      inset: 0;
      background: rgba(0, 0, 0, 0.8);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 200;
      border-radius: 1rem;
    }

    .death-overlay h2 {
      font-size: 3rem;
      margin-bottom: 1rem;
      color: #666;
    }

    .death-overlay p {
      font-size: 1.2rem;
      margin-bottom: 2rem;
      opacity: 0.8;
    }

    .death-overlay button {
      padding: 1rem 2rem;
      border: none;
      border-radius: 0.5rem;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      font-size: 1rem;
      cursor: pointer;
      transition: transform 0.2s;
    }

    .death-overlay button:hover {
      transform: scale(1.05);
    }

    .welcome-screen {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      background: rgba(26, 26, 46, 0.95);
      z-index: 100;
      padding: 2rem;
    }

    .welcome-screen h2 {
      font-size: 2rem;
      margin-bottom: 0.5rem;
    }

    .welcome-screen > p {
      opacity: 0.7;
      margin-bottom: 2rem;
    }

    .egg-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 1.5rem;
      max-width: 800px;
    }

    .egg-card {
      background: rgba(255, 255, 255, 0.05);
      border: 2px solid rgba(255, 255, 255, 0.1);
      border-radius: 1rem;
      padding: 1.5rem;
      cursor: pointer;
      transition: all 0.3s ease;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      position: relative;
      overflow: hidden;
    }

    .egg-card:hover:not(:disabled) {
      transform: translateY(-5px);
      border-color: var(--egg-color);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3), 0 0 20px var(--egg-color);
    }

    .egg-card:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .egg-visual {
      width: 80px;
      height: 100px;
      margin-bottom: 1rem;
      position: relative;
    }

    .egg-shape {
      width: 100%;
      height: 100%;
      border-radius: 50% 50% 50% 50% / 60% 60% 40% 40%;
      box-shadow: 
        inset -10px -10px 20px rgba(0, 0, 0, 0.3),
        inset 10px 10px 20px rgba(255, 255, 255, 0.2),
        0 5px 15px rgba(0, 0, 0, 0.3);
      animation: float 3s ease-in-out infinite;
    }

    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-10px); }
    }

    .egg-name {
      font-size: 1.1rem;
      font-weight: bold;
      margin-bottom: 0.25rem;
    }

    .egg-description {
      font-size: 0.8rem;
      opacity: 0.6;
    }

    .loading-overlay {
      position: absolute;
      bottom: 2rem;
      left: 50%;
      transform: translateX(-50%);
    }

    .loading {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      font-size: 1.2rem;
    }

    .spinner {
      width: 24px;
      height: 24px;
      border: 3px solid rgba(255, 255, 255, 0.3);
      border-top-color: white;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .connection-message {
      margin-top: 1rem;
      font-size: 0.875rem;
      opacity: 0.7;
    }

    .sidebar {
      width: 320px;
      padding: 1.5rem;
      background: rgba(0, 0, 0, 0.2);
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
      overflow-y: auto;
    }

    .creature-info {
      text-align: center;
    }

    .creature-name {
      font-size: 1.5rem;
      font-weight: bold;
      margin-bottom: 0.25rem;
    }

    .creature-type {
      font-size: 0.875rem;
      opacity: 0.7;
      text-transform: capitalize;
    }

    .creature-stage {
      font-size: 0.75rem;
      opacity: 0.5;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-top: 0.25rem;
    }

    .stats-section h3 {
      font-size: 0.875rem;
      opacity: 0.7;
      margin-bottom: 1rem;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .stat-bar {
      margin-bottom: 0.75rem;
    }

    .stat-label {
      display: flex;
      justify-content: space-between;
      font-size: 0.75rem;
      margin-bottom: 0.25rem;
      opacity: 0.8;
    }

    .stat-track {
      height: 8px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 4px;
      overflow: hidden;
    }

    .stat-fill {
      height: 100%;
      border-radius: 4px;
      transition: width 0.3s ease, background-color 0.3s ease;
    }

    .actions-section h3 {
      font-size: 0.875rem;
      opacity: 0.7;
      margin-bottom: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-top: 1rem;
    }

    .actions-section h3:first-child {
      margin-top: 0;
    }

    .action-buttons {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.5rem;
    }

    .action-btn {
      padding: 0.6rem 0.75rem;
      border: none;
      border-radius: 0.5rem;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      font-size: 0.8rem;
      cursor: pointer;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.3rem;
      position: relative;
      overflow: hidden;
      min-height: 40px;
    }

    .action-btn:hover:not(:disabled) {
      transform: translateY(-2px);
      box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
    }

    .action-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    /* Button variants */
    .action-btn.secondary {
      background: linear-gradient(135deg, #f59e0b 0%, #d97706 100%);
    }

    .action-btn.urgent {
      background: linear-gradient(135deg, #ef4444 0%, #dc2626 100%);
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0%, 100% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.7); }
      50% { box-shadow: 0 0 0 10px rgba(239, 68, 68, 0); }
    }

    .action-btn.success {
      background: linear-gradient(135deg, #22c55e 0%, #16a34a 100%);
    }

    .action-btn.danger {
      background: linear-gradient(135deg, #ef4444 0%, #dc2626 100%);
    }

    .action-btn .cooldown-overlay {
      position: absolute;
      bottom: 0;
      left: 0;
      height: 100%;
      background: rgba(0, 0, 0, 0.5);
      transition: width 1s linear;
      pointer-events: none;
    }

    /* Modal Styles */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.8);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 1000;
    }

    .modal {
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
      border-radius: 1rem;
      padding: 2rem;
      max-width: 400px;
      width: 90%;
      text-align: center;
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    .modal h3 {
      font-size: 1.5rem;
      margin-bottom: 1rem;
    }

    .modal p {
      opacity: 0.8;
      margin-bottom: 1.5rem;
    }

    .modal .reward {
      color: #22c55e;
      font-weight: bold;
    }

    .game-buttons {
      display: flex;
      gap: 1rem;
      justify-content: center;
      margin-bottom: 1rem;
    }

    .game-buttons button {
      padding: 1rem 2rem;
      border: none;
      border-radius: 0.5rem;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      font-size: 1.2rem;
      cursor: pointer;
      transition: transform 0.2s;
    }

    .game-buttons button:hover {
      transform: scale(1.05);
    }

    .modal .cancel-btn {
      padding: 0.75rem 1.5rem;
      border: none;
      border-radius: 0.5rem;
      background: rgba(255, 255, 255, 0.1);
      color: white;
      cursor: pointer;
    }

    /* Notifications */
    .notifications {
      position: fixed;
      top: 80px;
      right: 20px;
      z-index: 1000;
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }

    .notification {
      background: rgba(0, 0, 0, 0.9);
      border-left: 4px solid #667eea;
      padding: 1rem;
      border-radius: 0.5rem;
      max-width: 300px;
      animation: slideIn 0.3s ease;
    }

    @keyframes slideIn {
      from {
        transform: translateX(100%);
        opacity: 0;
      }
      to {
        transform: translateX(0);
        opacity: 1;
      }
    }

    .notification strong {
      display: block;
      margin-bottom: 0.25rem;
      color: #667eea;
    }

    .notification p {
      font-size: 0.875rem;
      opacity: 0.8;
      margin: 0;
    }
  </style>
</head>
<body>
  <div id="root"></div>
  
  <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pixi.js/7.4.0/pixi.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script type="text/babel" src="app.js"></script>
</body>
</html>
